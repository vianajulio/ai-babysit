quality_gate:
  provider: local
  ratchet: false
  workspace:
    temp_dir: .babysit/workspaces
    cleanup_after_run: true
    timeout_seconds: 300

  checks:
    file_size:
      enabled: true
      max_lines_per_file: 400
      max_lines_per_function: 80

    complexity:
      enabled: true
      tool: lizard
      max_cyclomatic_complexity: 10
      cannot_increase_average: true

    duplication:
      enabled: true
      tool: jscpd
      max_percent: 5
      cannot_increase: true
      fail_only_on_changed_files: true

    secrets:
      enabled: true
      tool: gitleaks
      block_on_detection: true

    big_o:
      enabled: false
      languages: ["csharp"]
      mode: hybrid
      fail_on_high: true
      warn_on_medium: true
      max_files_per_run: 20
      max_code_chars: 1000

    ai_review:
      enabled: false
      mode: suggest_only
      comment_on_pr: true

  pr_review:
    one_shot_max_files: 10
    one_shot_max_diff_lines: 800
    max_files_per_shard: 15
    max_diff_lines_per_shard: 1200
    parallel_hint: 4
    plan_ttl_minutes: 60
